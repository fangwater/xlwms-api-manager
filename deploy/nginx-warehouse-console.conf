location = /warehouse-console {
    return 301 /warehouse-console/;
}

location = /warehouse-console/healthz {
    proxy_pass http://127.0.0.1:18083/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /warehouse-console/evaluation-healthz {
    proxy_pass http://127.0.0.1:18087/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /warehouse-console/evaluation-api/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18087/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location ^~ /warehouse-console/api/ {
    client_max_body_size 145m;
    limit_except GET POST PATCH DELETE { deny all; }
    proxy_pass http://127.0.0.1:18083/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location ^~ /warehouse-console/assets/ {
    root /var/www;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "private, max-age=604800, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /warehouse-console/ {
    root /var/www;
    try_files $uri $uri/ /warehouse-console/index.html;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}
